name: ADFIP Windows Desktop Release

on:
  push:
    branches:
      - feature/frontend-rebuild
    tags:
      - 'v*'
  pull_request:
    branches:
      - feature/frontend-rebuild
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 Desktop (NSIS & MSI)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Set up Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri"

      - name: Install Python Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller>=6.5.0

      - name: Run Backend Automated Tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m pytest backend/tests/test_windows_desktop_deployment.py -v --tb=short -W ignore
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Backend automated tests failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Package Backend with PyInstaller
        shell: pwsh
        run: |
          pyinstaller backend/adfir-backend.spec --distpath dist --workpath build/pyinstaller -y
          if (-not (Test-Path "dist/adfir-backend/adfir-backend.exe")) {
            Write-Error "PyInstaller failed to produce dist/adfir-backend/adfir-backend.exe"
            exit 1
          }
          Write-Host "PyInstaller successfully generated dist/adfir-backend/adfir-backend.exe"

      - name: Verify Backend Executable Standalone Execution
        shell: pwsh
        run: |
          $env:PYTHONUNBUFFERED = "1"
          $env:ADFIP_PORT = "54321"
          $env:ADFIR_PORT = "54321"
          $env:ADFIP_INTERNAL_SECRET = "ci_test_secret_12345"
          $env:ADFIR_INTERNAL_SECRET = "ci_test_secret_12345"
          $env:ADFIP_DATA_DIR = "$env:TEMP\ADFIP_CI_DATA"
          $env:ADFIR_DATA_DIR = "$env:TEMP\ADFIP_CI_DATA"
          New-Item -ItemType Directory -Force -Path $env:ADFIP_DATA_DIR

          $stdoutLog = "$((Get-Location).Path)\backend_stdout.log"
          $stderrLog = "$((Get-Location).Path)\backend_stderr.log"

          $proc = Start-Process -FilePath "dist/adfir-backend/adfir-backend.exe" `
            -WorkingDirectory "dist/adfir-backend" `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru

          $ready = $false
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $healthUrl = "http://127.0.0.1:54321/api/v1/system/health"

          while ($stopwatch.Elapsed.TotalSeconds -lt 90) {
            Start-Sleep -Milliseconds 1000
            if ($proc.HasExited) {
              Write-Host "Backend process exited prematurely with code $($proc.ExitCode)"
              break
            }
            try {
              $resp = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 2
              if ($resp.status -eq "online") {
                $ready = $true
                Write-Host "Backend successfully verified online in $([math]::Round($stopwatch.Elapsed.TotalSeconds, 1))s: $($resp | ConvertTo-Json -Compress)"
                break
              }
            } catch {
              # Waiting for uvicorn listener
            }
          }

          # Gracefully trigger shutdown if running
          try {
            $headers = @{ "X-ADFIP-Bootstrap-Secret" = "ci_test_secret_12345" }
            Invoke-RestMethod -Uri "http://127.0.0.1:54321/api/v1/system/shutdown" -Method Post -Headers $headers -TimeoutSec 3
            Start-Sleep -Seconds 1
          } catch {
            Write-Host "Shutdown endpoint returned error or closed connection."
          }

          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
          }

          $errContent = Get-Content $stderrLog -Raw -ErrorAction SilentlyContinue
          $outContent = Get-Content $stdoutLog -Raw -ErrorAction SilentlyContinue
          $crashLog = "dist/adfir-backend/backend_crash.log"
          $crashContent = ""
          if (Test-Path $crashLog) {
            $crashContent = Get-Content $crashLog -Raw -ErrorAction SilentlyContinue
          }

          Write-Host "=== Backend Stderr ==="
          Write-Host $errContent
          Write-Host "=== Backend Stdout ==="
          Write-Host $outContent
          if ($crashContent) {
            Write-Host "=== Backend Crash Log ==="
            Write-Host $crashContent
          }

          if (-not $ready) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Backend Stderr`n``````text`n$errContent`n``````"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Backend Stdout`n``````text`n$outContent`n``````"
            if ($crashContent) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Backend Crash Log`n``````text`n$crashContent`n``````"
            }
            $cleanErr = "$errContent $crashContent" -replace "`r?`n", " -- "
            $headErr = if ($cleanErr.Length -gt 200) { $cleanErr.Substring(0, 200) } else { $cleanErr }
            $tailErr = if ($cleanErr.Length -gt 350) { $cleanErr.Substring($cleanErr.Length - 350) } else { "" }
            Write-Host "::error title=Backend Startup Head::$headErr"
            if ($tailErr) { Write-Host "::error title=Backend Startup Tail::$tailErr" }
            Write-Error "Backend readiness check timed out or failed. Stderr: $errContent"
            exit 1
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Backend Standalone Execution`n- Status: ONLINE`n- Port: 54321`n- PID: $($proc.Id)"
          }

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Vite Assets
        shell: pwsh
        run: |
          cd frontend
          npm run build

      - name: Build Tauri Desktop Installers (NSIS & MSI)
        shell: pwsh
        run: |
          cd frontend
          npx tauri build --bundles nsis,msi --no-sign

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          npm install -g @microsoft/winappcli
          if (Get-Command winapp -ErrorAction SilentlyContinue) {
            Write-Host "WinApp CLI successfully installed: $(winapp --version 2>$null)"
          } else {
            Write-Warning "winapp command not found in global path, will fall back to MakeAppx."
          }

      - name: Generate MSIX Package Assets
        shell: pwsh
        run: |
          python scripts/prepare_msix_assets.py

      - name: Package MSIX Application
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package-msix.ps1 -Version "0.1.0.0"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSIX packaging failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Install and Verify MSIX Desktop Application
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify-msix-installed.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSIX installation verification failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Verify Generated Installers
        shell: pwsh
        run: |
          $bundleDir = "frontend/src-tauri/target/release/bundle"
          $nsisExes = Get-ChildItem -Path "$bundleDir/nsis/*.exe" -ErrorAction SilentlyContinue
          $msiPkgs = Get-ChildItem -Path "$bundleDir/msi/*.msi" -ErrorAction SilentlyContinue
          $msixPkgs = Get-ChildItem -Path "dist/*.msix" -ErrorAction SilentlyContinue
          $backendExe = Get-Item -Path "dist/adfir-backend/adfir-backend.exe" -ErrorAction SilentlyContinue

          Write-Host "Discovered Standalone Backend Executable:"
          if ($backendExe) {
            Write-Host " - $($backendExe.FullName) ($([math]::Round($backendExe.Length / 1MB, 2)) MB)"
          } else {
            Write-Error "Backend executable missing at dist/adfir-backend/adfir-backend.exe"
            exit 1
          }

          Write-Host "Discovered NSIS Installers:"
          $nsisExes | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

          Write-Host "Discovered MSI Installers:"
          $msiPkgs | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

          Write-Host "Discovered MSIX Packages:"
          $msixPkgs | ForEach-Object { Write-Host " - $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

          if ($nsisExes.Count -eq 0 -and $msiPkgs.Count -eq 0 -and $msixPkgs.Count -eq 0) {
            Write-Error "No Windows installer or MSIX package was generated!"
            exit 1
          }
          if ($msixPkgs.Count -eq 0) {
            Write-Error "MSIX package was not generated!"
            exit 1
          }

      - name: Upload Windows Backend Binary & Installers
        uses: actions/upload-artifact@v4
        with:
          name: ADFIP-Windows-x64-Binaries-and-Installers
          path: |
            dist/adfir-backend/adfir-backend.exe
            dist/*.msix
            dist/*.cer
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ADFIP-Diagnostic-Logs
          path: |
            *.log
            dist/*.log
            dist/adfir-backend/backend_crash.log
            pytest_log.txt
          if-no-files-found: ignore
          retention-days: 7
